name: Build and Release Binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          architecture: x86
          cache: maven

      - name: Build and package
        run: mvn -Pdist package jpackage:jpackage@win

      # ---------- Package output ----------
      - name: Archive
        shell: pwsh
        run: |
          Push-Location target\output\Nautilus
          tar -a -c -f ../../../nautilus-${{ github.ref_name }}-windows-x86.zip *
          Pop-Location

      # ---------- Upload artifacts ----------
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nautilus-windows-x86
          path: nautilus-${{ github.ref_name }}-windows-x86.zip

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: nautilus-${{ github.ref_name }}-windows-x86.zip